name: CI

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  laravel-lsp:
    name: LSP — test, fmt, clippy
    strategy:
      # Every leg runs to completion — one platform's failure must not cancel
      # the others, or a Windows break would hide whether Linux and macOS are
      # still green.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Scoped per-leg, deliberately: a bare job-level `continue-on-error: true`
    # would make the Linux and macOS legs non-blocking too. Windows is new and
    # expected to surface pre-existing failures (the tree carries ~455
    # Unix-rooted path literals); it reports without blocking until those are
    # triaged into their own issues. Dropping this is tracked in #292.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    defaults:
      run:
        # GitHub-hosted Windows runners ship Git Bash, so one shell keeps all
        # three legs running byte-identical commands — `cp`, path expansion and
        # quoting included. Without it Windows would default to PowerShell and
        # the steps would silently diverge from what Linux and macOS run.
        shell: bash
        working-directory: laravel-lsp
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: laravel-lsp

      - name: Bootstrap test fixture .env
        # `test-project/.env` is gitignored, but the integration tests
        # under `laravel-lsp/tests/integration_tests.rs` need one to
        # exercise env parsing + variable extraction.
        working-directory: .
        run: cp test-project/.env.example test-project/.env

      - name: Setup PHP for test fixture
        uses: shivammathur/setup-php@v2
        with:
          # 8.4 matches the actual minimum required by the locked
          # vendor packages (symfony/* v8.0 requires >= 8.4).
          php-version: '8.4'
          # The PHP extensions test-project's dependency graph declares, taken
          # from the `ext-*` requires across its installed vendor tree rather
          # than guessed. Ubuntu's runner PHP bundles these, so the single-OS
          # job got them for free; the Windows runner bundles fewer, and
          # composer refused to resolve — first on ext-intl (filament/support),
          # then ext-fileinfo (league/flysystem-local). Listing the whole set
          # makes the requirement explicit for every leg instead of leaving one
          # platform's defaults to carry it, and avoids discovering them one
          # failed run at a time (issue #292).
          #
          # `pcntl` and `posix` appear in that scan too but are deliberately
          # absent: they do not exist on Windows, and nothing in the resolved
          # graph hard-requires them.
          extensions: intl, fileinfo, mbstring, dom, tokenizer, iconv, filter, bcmath, openssl, libxml, ctype, xmlwriter, curl, zip, xml, gmp

      - name: Install test-project Composer dependencies
        # `test-project/vendor/` AND `composer.lock` are gitignored — the
        # lock is intentionally untracked so its transitive deps don't
        # surface Dependabot alerts for a fixture that never ships. We use
        # `composer update` (not `install`) to resolve + write a fresh lock
        # on the runner from `composer.json`. The route-discovery integration
        # tests need real vendor packages (e.g. Fortify) on disk to exercise
        # package-priority routing. `--no-dev` skips Pest and PHPUnit — we
        # don't run PHP tests here, just exercise the on-disk vendor layout.
        # `--no-scripts` skips the fixture's post-update artisan scripts:
        # `composer update` fires `post-update-cmd`, which runs the dev-only
        # `boost:update` (laravel/boost is require-dev, so it's absent under
        # `--no-dev`) and would exit 1. The integration tests read vendor/ and
        # composer/installed.json directly, so no post-install script is needed.
        working-directory: test-project
        run: composer update --no-interaction --prefer-dist --no-progress --no-dev --no-scripts

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --all-features

  extension:
    name: Extension — wasm check, fmt, clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --target wasm32-wasip2 -- -D warnings

      - name: cargo check
        run: cargo check --target wasm32-wasip2

      # The unit tests in src/lib.rs live in this (root) crate, so they only run
      # here — the laravel-lsp job's `cargo test` is a different crate. Run on the
      # host target: the tests are pure (no wasm runtime needed), so no wasm test
      # runner is required despite the crate being a cdylib.
      - name: cargo test
        run: cargo test
