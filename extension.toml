id = "laravel"
name = "Laravel"
description = "Laravel support for Zed — go-to-definition, hover & find-references for Blade, Livewire, Flux, views, routes, and config. 📖 See the README for setup & configuration; custom PHP/Blade language servers need a one-line settings tweak."
version = "0.4.1"
schema_version = 1
authors = ["Mike Bronner <mike.bronner@icloud.com>"]
repository = "https://github.com/mike-bronner/zed-laravel"

[lib]
kind = "Rust"
version = "0.4.1"

[language_servers.laravel-lsp]
name = "Laravel"
# XML: for phpunit.xml env var autocomplete
# Shell Script: Zed treats .env files as Shell Script (see bash/config.toml path_suffixes)
languages = ["PHP", "Blade", "XML", "Shell Script"]
